name: Deploy Interactive G2 Demo to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit, HUD, voice & bridge test suite
        run: npm test

      - name: Build production Companion, G2 Studio & .ehpk package
        run: npm run pack

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Stage .ehpk download, .nojekyll & absolute OpenGraph preview URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cp telegifts-g2.ehpk dist/telegifts-g2.ehpk
          touch dist/.nojekyll
          if [ -n "$PAGES_BASE_URL" ]; then
            node -e "
              const fs = require('node:fs');
              const base = process.env.PAGES_BASE_URL.replace(/\/+$/, '');
              const html = fs.readFileSync('dist/index.html', 'utf8')
                .replaceAll('./og-preview.jpg', base + '/og-preview.jpg');
              fs.writeFileSync('dist/index.html', html);
            "
          fi

      - name: Run public repository & build hygiene audit
        run: npm run audit:public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
